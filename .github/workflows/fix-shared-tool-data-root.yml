name: Align observer with shared tool data root

on:
  push:
    branches:
      - codex/macos-production-parity-2026-09

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[shared-tool-root-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/macos-production-parity-2026-09
          fetch-depth: 0
      - name: Align observer storage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('current-integration/src/AndroidTools.MyPowerTools/RemoteNotificationsServiceObserverModule.cs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '    private RemoteNotificationsLegacyStore? _store;\n    private long _settingsRevision = 1;\n',
                  '    private RemoteNotificationsLegacyStore? _store;\n    private string _sharedDataDirectory = "";\n    private long _settingsRevision = 1;\n'
              ),
              (
                  '        Directory.CreateDirectory(context.DataDirectory);\n        Directory.CreateDirectory(context.CacheDirectory);\n        Directory.CreateDirectory(context.LogDirectory);\n        _settingsStore = new RemoteNotificationSettingsStore(\n            Path.Combine(context.DataDirectory, "settings.json"));\n        _store = new RemoteNotificationsLegacyStore(_settingsStore, context.DataDirectory);\n',
                  '        _sharedDataDirectory = ResolveSharedToolDataDirectory(context.DataDirectory);\n        Directory.CreateDirectory(_sharedDataDirectory);\n        Directory.CreateDirectory(context.CacheDirectory);\n        Directory.CreateDirectory(context.LogDirectory);\n        _settingsStore = new RemoteNotificationSettingsStore(\n            Path.Combine(_sharedDataDirectory, "settings.json"));\n        _store = new RemoteNotificationsLegacyStore(_settingsStore, _sharedDataDirectory);\n'
              ),
              (
                  '            ["dataDirectory"] = Context.DataDirectory\n',
                  '            ["dataDirectory"] = _sharedDataDirectory\n'
              ),
              (
                  '    public ValueTask DisposeAsync(CancellationToken cancellationToken)\n',
                  '''    internal static string ResolveSharedToolDataDirectory(string moduleDataDirectory)\n    {\n        var configured = Environment.GetEnvironmentVariable("MPT_TOOL_DATA_ROOT");\n        if (!string.IsNullOrWhiteSpace(configured))\n        {\n            return Path.GetFullPath(Environment.ExpandEnvironmentVariables(configured));\n        }\n\n        var data = new DirectoryInfo(Path.GetFullPath(moduleDataDirectory));\n        var module = data.Parent;\n        var modules = module?.Parent;\n        var state = modules?.Parent;\n        if (string.Equals(data.Name, "data", StringComparison.OrdinalIgnoreCase) &&\n            string.Equals(module?.Name, "android-tools.notifications", StringComparison.OrdinalIgnoreCase) &&\n            string.Equals(modules?.Name, "modules", StringComparison.OrdinalIgnoreCase) &&\n            state is not null)\n        {\n            return Path.Combine(state.FullName, "tools", "remote-notifications");\n        }\n\n        return data.FullName;\n    }\n\n    public ValueTask DisposeAsync(CancellationToken cancellationToken)\n'''
              )
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f'non-unique observer storage patch: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-shared-tool-data-root.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(runtime): share the service and Surface data root [shared-tool-root-fixed]"
          git push origin HEAD:codex/macos-production-parity-2026-09
