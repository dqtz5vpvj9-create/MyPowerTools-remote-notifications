name: Apply observer protocol namespace fix

on:
  push:
    branches:
      - codex/macos-production-parity-2026-09

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[observer-using-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/macos-production-parity-2026-09
          fetch-depth: 0
      - name: Add protocol namespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('current-integration/src/AndroidTools.MyPowerTools/RemoteNotificationsServiceObserverModule.cs')
          text = path.read_text(encoding='utf-8')
          old = 'using MyPowerTools.Abstractions;\n'
          new = old + 'using MyPowerTools.Protocol;\n'
          if text.count(old) != 1:
              raise RuntimeError('observer using insertion point is not unique')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-observer-protocol-using.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(build): import protocol error codes [observer-using-fixed]"
          git push origin HEAD:codex/macos-production-parity-2026-09
